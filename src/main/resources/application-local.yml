spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/afertech
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: local-dev-secret-12345678901234567890
  expiration: 3600000
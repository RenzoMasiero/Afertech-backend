version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: afertech-postgres
    restart: always
    environment:
      POSTGRES_DB: afertech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: afertech-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/afertech
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change_this_secret
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"

volumes:
  postgres_data:
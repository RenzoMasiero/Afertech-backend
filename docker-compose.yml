services:

  postgres:
    image: postgres:15
    container_name: afertech-postgres
    restart: always
    environment:
      POSTGRES_DB: afertech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: afertech-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: C:/Users/Renzo/Documents/FrontEnd/Afertech/afertech-frontend
    container_name: afertech-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data: